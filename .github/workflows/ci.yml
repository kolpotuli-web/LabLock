name: LabLock CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lightweight API test dependencies
        run: python -m pip install "numpy<2" "opencv-python-headless<4.12" fastapi uvicorn pydantic python-dotenv httpx pytest
      - name: Compile Python sources
        run: python -m compileall -q server.py tests
      - name: Run API integration tests
        run: pytest -q
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Validate required project files
        run: |
          test -s server.py
          test -s index.html
          test -s dashboard.html
          test -s styles.css
          test -s requirements.txt
          test -s lablock_final/yolov8n.pt
